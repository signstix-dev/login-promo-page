<!DOCTYPE html>
<html lang="en">
<head>

  <title>SignStix Embed</title>

  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:365px;height:446px;overflow:hidden;background:transparent;font-family:Poppins,sans-serif}
.card{position:relative;width:365px;height:446px;background:#fbfaf8;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y;font-family:Poppins,sans-serif;text-align:left}
.card *{box-sizing:border-box;margin:0;padding:0}
.viewport{flex:1;min-height:0;overflow:hidden;position:relative;z-index:1}
.track{display:flex;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.slide{position:relative;width:365px;height:100%;flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding:30px 28px 44px;overflow:hidden}
.cat{text-align:var(--a-label,left);color:var(--t-label,#00243e);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;min-height:12px;flex-shrink:0}
.heading{text-align:var(--a-heading,left);font-size:24px;font-weight:700;color:var(--t-heading,#00243e);line-height:1.15;letter-spacing:-.015em;flex-shrink:0}
.heading span{color:var(--t-highlight,#f26724)}
.media{position:relative;flex:0 1 190px;min-height:110px;display:flex;align-items:center;justify-content:center}
.ic{position:relative;z-index:2;width:88px;height:88px;border-radius:24px;background:linear-gradient(140deg,var(--ta,var(--c1)),var(--tb,var(--c2)));display:grid;place-items:center;box-shadow:0 16px 30px -12px var(--tb,var(--c2))}
.ic svg{width:50%;height:50%}
.pic{position:relative;z-index:2;display:block;max-width:150px;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(0,36,62,.18))}
.art{width:156px;height:117px;filter:drop-shadow(0 12px 18px rgba(0,36,62,.14))}
.art svg{display:block;width:100%;height:100%}
.kind-learn .art{width:104px;height:78px}
.kind-release .art{width:88px;height:66px;margin-top:-14px}
.desc b{font-weight:700}
.desc{margin-block:auto;text-align:var(--a-text,left);font-size:12.5px;color:var(--t-text,#5c6670);line-height:1.6;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;height:44px;flex-shrink:0;border-radius:12px;background:var(--t-button,#00243e);color:var(--t-buttonText,#fff);font-size:13px;font-weight:600;letter-spacing:.02em;text-decoration:none;padding:0 7px 0 18px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arr{width:30px;height:30px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;background:linear-gradient(140deg,#3B6C81,#0A364B);transition:transform .2s}
.arr svg{width:14px;height:14px}
.btn:hover .arr{transform:translateX(2px)}
.radio-row{position:relative;z-index:2;height:34px;margin-top:-34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:7px}
.radio-row button{border:0;padding:0;cursor:pointer;width:9px;height:9px;border-radius:999px;background:#d9d6d3;transition:width .3s,background .3s}
.radio-row button.active{width:26px;background:#00243e}
.card a:focus-visible,.card button:focus-visible{outline:2px solid #00243e;outline-offset:3px}
.shape{position:absolute;pointer-events:none}
.slide .cat,.slide .heading,.slide .desc,.slide .btn{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.slide .ic,.slide .pic{opacity:0;transform:scale(.85) rotate(-6deg);transition:opacity .5s ease .1s,transform .7s cubic-bezier(.2,1.4,.4,1) .1s}
.slide.on .cat{transition-delay:.15s}.slide.on .heading{transition-delay:.22s}.slide.on .desc{transition-delay:.3s}.slide.on .btn{transition-delay:.38s}
.slide.on .cat,.slide.on .heading,.slide.on .desc,.slide.on .btn,.slide.on .ic,.slide.on .pic{opacity:1;transform:none}
.orbit{left:50%;top:50%;border-radius:50%;translate:-50% -50%}
.o1{width:150px;height:150px;border:1.5px solid color-mix(in srgb,var(--c3) 28%,transparent)}

.o2{width:184px;height:184px;border:1.5px dashed color-mix(in srgb,var(--c4) 30%,transparent);animation:ss-spin 40s linear infinite}
.o2 b{position:absolute;clip-path:polygon(50% 0%,62% 35%,100% 38%,70% 60%,80% 98%,50% 76%,20% 98%,30% 60%,0% 38%,38% 35%);width:15px;height:15px}
.o2 b:nth-child(1){background:var(--c5);top:11px;left:23px}
.o2 b:nth-child(2){background:var(--c4);bottom:27px;right:1px;width:18px;height:18px}
.o2 b:nth-child(3){background:var(--c2);bottom:3px;left:59px;width:12px;height:12px}
.deck{left:50%;top:50%;width:0;height:0}
.deck .ls{position:absolute;width:118px;height:80px;left:-59px;top:-52px;border-radius:14px;background:#fff;border:1.5px solid rgba(0,36,62,.1);box-shadow:0 10px 22px -14px rgba(0,36,62,.4);transition:transform .8s cubic-bezier(.2,1.2,.4,1)}

.deck .ls::after{content:"";position:absolute;left:10px;top:52px;width:60%;height:5px;border-radius:5px;background:rgba(0,36,62,.12);box-shadow:0 10px 0 -.5px rgba(0,36,62,.07)}

.deck .l2{--t:color-mix(in srgb,var(--c4) 22%,white)}
.slide.on .deck .l1{transform:translate(-62px,8px) rotate(-12deg);transition-delay:.25s}
.slide.on .deck .l2{transform:translate(62px,8px) rotate(12deg);transition-delay:.35s}
.timeline{left:50%;top:50%;width:190px;height:22px;translate:-50% 58px}
.timeline .rail{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;opacity:.35;background:linear-gradient(90deg,var(--c1) 0 24%,transparent 24% 26%,var(--c2) 26% 49%,transparent 49% 51%,var(--c3) 51% 74%,transparent 74% 76%,var(--c4) 76% 100%)}
.timeline .fill{position:absolute;left:0;top:9px;height:4px;width:0;border-radius:4px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4));background-size:190px 4px}
.timeline .head{position:absolute;top:4px;left:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:3px solid #00243e;box-shadow:0 2px 6px rgba(0,36,62,.25)}
.slide.on .timeline .fill{animation:ss-play 6s linear .6s infinite}
.slide.on .timeline .head{animation:ss-head 6s linear .6s infinite}
.kind-learn .ic{width:80px;height:80px;border-radius:22px;margin-top:-26px}
.kind-learn .pic{max-width:100px;max-height:72px;margin-top:-26px}
.apknet{left:50%;top:50%;width:280px;height:150px;margin:-75px 0 0 -140px}

.apknet .ns .fill{position:absolute;inset:0;background:linear-gradient(135deg,var(--na,#FFD3B5) 0%,var(--nb,#FFAA78) 45%,var(--nt,#F07A3A) 100%);transform-origin:50% 100%;transform:scaleY(0)}
.apknet .ns .ok{position:absolute;inset:0;display:grid;place-items:center;opacity:0}
.apknet .ns .ok svg{width:18px;height:18px}
.apknet .lab{position:absolute;top:122px;width:80px;text-align:center;font:700 9.5px Poppins,sans-serif;color:var(--nt,#F07A3A);opacity:0}
.apknet .s1{left:0}.apknet .s2{left:100px}.apknet .s3{left:200px}
.slide.on .apknet .hub{animation:ss-nhub 4.8s ease-in-out infinite}
.slide.on .apknet .pkt{animation:ss-npkt 4.8s ease-in infinite}
.slide.on .apknet .ns .fill{animation:ss-nfill 4.8s ease-in-out infinite}
.slide.on .apknet .ns .ok,.slide.on .apknet .lab{animation:ss-nok 4.8s ease-in-out infinite}
.slide.on .apknet .d2,.slide.on .apknet .d2 .fill,.slide.on .apknet .d2 .ok{animation-delay:.45s}
.slide.on .apknet .d3,.slide.on .apknet .d3 .fill,.slide.on .apknet .d3 .ok{animation-delay:.9s}

@keyframes ss-npkt{0%,6%{opacity:0;transform:translateY(0)}10%{opacity:1}26%{opacity:1;transform:translateY(48px)}30%,100%{opacity:0;transform:translateY(48px)}}
@keyframes ss-nfill{0%,26%{transform:scaleY(0)}40%,86%{transform:scaleY(1)}96%,100%{transform:scaleY(0)}}
@keyframes ss-nok{0%,38%{opacity:0;transform:scale(.6)}46%,86%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(.9)}}
.screen{left:50%;top:50%;width:204px;height:120px;translate:-50% -50%;border:1.5px solid rgba(0,36,62,.16);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(0,36,62,.03))}
.screen::before{content:"";position:absolute;inset:7px 7px 16px;border-radius:7px;background:rgba(0,36,62,.035)}
.screen::after{content:"";position:absolute;left:50%;bottom:6px;width:4px;height:4px;border-radius:50%;translate:-50% 0;background:rgba(0,36,62,.2)}
.screen .stand{display:none}
.screen .up{position:absolute;right:-15px;top:-15px;width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,#3B6C81,#0A364B);display:grid;place-items:center;box-shadow:0 8px 16px -6px rgba(10,54,75,.55)}
.screen .up::before,.screen .up::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #3B6C81;opacity:0}
.screen .up svg{width:17px;height:17px}
.slide.on .screen .up{animation:ss-pulse 1.8s ease-in-out infinite}
.slide.on .screen .up svg{animation:ss-nudge 1.8s ease-in-out infinite}
.slide.on .screen .up::before{animation:ss-ring 1.8s ease-out infinite}
.slide.on .screen .up::after{animation:ss-ring 1.8s ease-out .9s infinite}
.screen .dots{position:absolute;top:10px;left:12px;display:flex;gap:4px}
.screen .dots b{width:5px;height:5px;border-radius:50%;background:rgba(0,36,62,.15)}
.kind-release .ic,.kind-release .pic,.kind-release .ph{display:none!important}
.kind-release .media{flex-basis:150px}
.kind-release .media{flex-grow:1}
.kind-release .desc{margin-block:2px 8px}
.kind-release .apknet{margin-top:-68px}
.no-desc .media{flex-grow:1}
.no-btn .media{flex-grow:1}
.no-btn .desc{margin-block:6px 18px}
.kind-idea .media{flex-basis:178px}
.kind-season .ic,.kind-season .pic,.kind-season .ph{display:none!important}
.kind-season .media{flex-basis:175px}
.seas{left:-28px;right:-28px;top:0;bottom:0;overflow:hidden}
.seas .glow{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:radial-gradient(circle,var(--g) 0%,transparent 70%)}

.slide.on .seas .blow{animation:ss-blow var(--d) linear var(--dl) infinite}

.seas .sky .win{opacity:.35}

.seas .bigfire{width:130px;height:120px;margin-left:-65px}
